<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a2452"/>
      <stop offset="50%"  stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <line x1="0"    y1="120" x2="1200" y2="120" stroke="#fff" stroke-width="0.4" opacity="0.08"/>
  <line x1="0"    y1="200" x2="1200" y2="200" stroke="#fff" stroke-width="0.4" opacity="0.08"/>
  <line x1="0"    y1="280" x2="1200" y2="280" stroke="#fff" stroke-width="0.4" opacity="0.08"/>
  <line x1="300"  y1="0"   x2="300"  y2="400" stroke="#fff" stroke-width="0.4" opacity="0.06"/>
  <line x1="600"  y1="0"   x2="600"  y2="400" stroke="#fff" stroke-width="0.4" opacity="0.06"/>
  <line x1="900"  y1="0"   x2="900"  y2="400" stroke="#fff" stroke-width="0.4" opacity="0.06"/>

  <!-- Decorative glow circles -->
  <circle cx="1100" cy="80"  r="200" fill="#f7931a" opacity="0.05"/>
  <circle cx="900"  cy="350" r="150" fill="#0dcaf0" opacity="0.04"/>

  <!-- ── Mini candlestick chart (right side) ── -->
  <g transform="translate(720, 60)">
    <!-- Candles -->
    <!-- red -->
    <line x1="30"  y1="195" x2="30"  y2="245" stroke="#dc3545" stroke-width="3"/>
    <rect x="22"   y="205" width="16" height="30"  fill="#dc3545" rx="2"/>
    <!-- green -->
    <line x1="75"  y1="165" x2="75"  y2="215" stroke="#28a745" stroke-width="3"/>
    <rect x="67"   y="170" width="16" height="38"  fill="#28a745" rx="2"/>
    <!-- red -->
    <line x1="120" y1="178" x2="120" y2="228" stroke="#dc3545" stroke-width="3"/>
    <rect x="112"  y="185" width="16" height="32"  fill="#dc3545" rx="2"/>
    <!-- green -->
    <line x1="165" y1="138" x2="165" y2="195" stroke="#28a745" stroke-width="3"/>
    <rect x="157"  y="143" width="16" height="44"  fill="#28a745" rx="2"/>
    <!-- green -->
    <line x1="210" y1="108" x2="210" y2="168" stroke="#28a745" stroke-width="3"/>
    <rect x="202"  y="113" width="16" height="48"  fill="#28a745" rx="2"/>
    <!-- red -->
    <line x1="255" y1="118" x2="255" y2="175" stroke="#dc3545" stroke-width="3"/>
    <rect x="247"  y="125" width="16" height="40"  fill="#dc3545" rx="2"/>
    <!-- green -->
    <line x1="300" y1="75"  x2="300" y2="138" stroke="#28a745" stroke-width="3"/>
    <rect x="292"  y="80"   width="16" height="50"  fill="#28a745" rx="2"/>
    <!-- green -->
    <line x1="345" y1="48"  x2="345" y2="115" stroke="#28a745" stroke-width="3"/>
    <rect x="337"  y="53"   width="16" height="55"  fill="#28a745" rx="2"/>

    <!-- Gold trend line -->
    <polyline points="22,228  67,192  112,208  157,164  202,136  247,148  292,106  337,74"
              fill="none" stroke="#f7931a" stroke-width="4" stroke-linejoin="round"/>
    <!-- Glowing tip -->
    <circle cx="345" cy="70" r="10" fill="#f7931a" opacity="0.3"/>
    <circle cx="345" cy="70" r="6"  fill="#f7931a"/>
  </g>

  <!-- ── Text block (left) ── -->
  <!-- Icon replica (small candlestick) -->
  <circle cx="96" cy="96" r="52" fill="#0a2452" stroke="#f7931a" stroke-width="3"/>
  <g transform="translate(60,68)">
    <line x1="10" y1="44" x2="10" y2="58" stroke="#dc3545" stroke-width="2"/>
    <rect x="6"   y="47" width="8" height="8"  fill="#dc3545" rx="1"/>
    <line x1="22" y1="34" x2="22" y2="50" stroke="#28a745" stroke-width="2"/>
    <rect x="18"  y="37" width="8" height="10" fill="#28a745" rx="1"/>
    <line x1="34" y1="40" x2="34" y2="55" stroke="#dc3545" stroke-width="2"/>
    <rect x="30"  y="43" width="8" height="9"  fill="#dc3545" rx="1"/>
    <line x1="46" y1="26" x2="46" y2="42" stroke="#28a745" stroke-width="2"/>
    <rect x="42"  y="29" width="8" height="10" fill="#28a745" rx="1"/>
    <line x1="58" y1="18" x2="58" y2="34" stroke="#28a745" stroke-width="2"/>
    <rect x="54"  y="21" width="8" height="10" fill="#28a745" rx="1"/>
    <polyline points="6,54  18,42  30,47  42,34  54,26  66,18"
              fill="none" stroke="#f7931a" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="66" cy="18" r="4" fill="#f7931a"/>
    <text x="4" y="78" font-size="11" fill="#ffd700" font-family="Arial,sans-serif" font-weight="bold">$ € £ ₿</text>
  </g>

  <!-- Main title -->
  <text x="165" y="80" font-size="52" fill="#ffffff" font-weight="800"
        font-family="Arial,sans-serif">Forex &amp; Stock</text>
  <text x="165" y="140" font-size="52" fill="#f7931a" font-weight="800"
        font-family="Arial,sans-serif">Market Tracker</text>

  <!-- Subtitle -->
  <text x="165" y="188" font-size="20" fill="#a8b2c8"
        font-family="Arial,sans-serif">Live Forex · Stocks · Crypto — 100% free APIs, no key required</text>

  <!-- Badge pills -->
  <rect x="165" y="218" width="145" height="34" rx="17" fill="#f7931a" opacity="0.18"
        stroke="#f7931a" stroke-width="1.5"/>
  <text x="238" y="240" font-size="13" fill="#f7931a" text-anchor="middle"
        font-family="Arial,sans-serif">🟠 CoinGecko</text>

  <rect x="320" y="218" width="165" height="34" rx="17" fill="#0dcaf0" opacity="0.15"
        stroke="#0dcaf0" stroke-width="1.5"/>
  <text x="403" y="240" font-size="13" fill="#0dcaf0" text-anchor="middle"
        font-family="Arial,sans-serif">💱 Frankfurter</text>

  <rect x="495" y="218" width="170" height="34" rx="17" fill="#6ea8fe" opacity="0.15"
        stroke="#6ea8fe" stroke-width="1.5"/>
  <text x="580" y="240" font-size="13" fill="#6ea8fe" text-anchor="middle"
        font-family="Arial,sans-serif">📊 Yahoo Finance</text>

  <!-- Odoo 19 badge -->
  <rect x="1080" y="18" width="110" height="34" rx="17" fill="#f7931a"/>
  <text x="1135" y="40" font-size="14" fill="#fff" text-anchor="middle"
        font-weight="bold" font-family="Arial,sans-serif">Odoo 19.0</text>

  <!-- Bottom divider line -->
  <rect x="0" y="390" width="1200" height="10" fill="#f7931a" opacity="0.5"/>
</svg>
